# Gateway unico: stessa origine per app e API Supabase-compatibili.
#   /auth/v1/*  → GoTrue (autenticazione)
#   /rest/v1/*  → PostgREST (dati, protetti da RLS)
#   /*          → Next.js

map $http_x_forwarded_proto $proto_effettivo {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;   # allegati PDF dell'invio email
  server_tokens off;

  proxy_http_version 1.1;
  proxy_set_header Host              $http_host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $proto_effettivo;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $http_connection;
  proxy_read_timeout 120s;
  # ⚠ Nessun proxy_set_header dentro le location: in nginx una location che ne
  #   definisce anche solo uno NON eredita quelli del blocco server.

  location = /auth/v1 { return 301 /auth/v1/; }
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
  }

  location = /rest/v1 { return 301 /rest/v1/; }
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
  }

  location / {
    proxy_pass http://app:3000;
  }
}

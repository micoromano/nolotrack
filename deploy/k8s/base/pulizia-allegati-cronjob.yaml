# Pulizia notturna degli allegati su R2: cancella dal bucket i file delle voci
# eliminate e gli upload mai completati (vedi app/api/allegati/pulizia).
# Passa dal gateway perché la NetworkPolicy ammette verso l'app solo il gateway.
# Senza R2 configurato la route risponde 503: il job fallisce senza conseguenze.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pulizia-allegati
  labels: { app.kubernetes.io/name: pulizia-allegati }
spec:
  schedule: "30 4 * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app.kubernetes.io/name: pulizia-allegati }
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.11.1
              args:
                - -fsS
                - -X
                - POST
                - -H
                - "Authorization: Bearer $(CRON_SECRET)"
                - http://gateway/api/allegati/pulizia
              env:
                - name: CRON_SECRET
                  valueFrom: { secretKeyRef: { name: nolotrack-secrets, key: CRON_SECRET } }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 64Mi }

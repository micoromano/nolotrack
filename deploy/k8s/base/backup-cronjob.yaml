# Backup notturno dei dati (stesso formato di scripts/backup.sh: solo dati di
# public + auth, formato custom pg_dump). Conserva gli ultimi BACKUP_CONSERVA file.
# ⚠ Il PVC vive nel cluster: copia i backup anche FUORI (vedi KUBERNETES.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  labels: { app.kubernetes.io/name: backup }
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app.kubernetes.io/name: backup }
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: supabase/postgres:15.8.1.060
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  FILE="/backups/nolotrack_$(date +%Y%m%d_%H%M%S).dump"
                  pg_dump -h db -U supabase_admin -d postgres \
                    --format=custom --data-only --schema=public --schema=auth \
                    --exclude-table-data=auth.schema_migrations -f "$FILE.tmp"
                  mv "$FILE.tmp" "$FILE"
                  echo "Backup creato: $FILE ($(du -h "$FILE" | cut -f1))"
                  ls -1t /backups/nolotrack_*.dump | tail -n +"$((BACKUP_CONSERVA + 1))" | xargs -r rm -f
              env:
                - { name: BACKUP_CONSERVA, value: "30" }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: nolotrack-secrets, key: POSTGRES_PASSWORD } }
              volumeMounts:
                - { name: backups, mountPath: /backups }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: backups }

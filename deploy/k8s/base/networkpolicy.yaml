# Isolamento di rete (efficace solo con un CNI che applica le NetworkPolicy:
# Calico, Cilium, k3s/kube-router…). Pubblico è solo il gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-solo-da-servizi-interni
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: db }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: auth } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: rest } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: app } }      # initContainer migrate
        - podSelector: { matchLabels: { app.kubernetes.io/name: backup } }
      ports:
        - { port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-solo-da-gateway
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [auth, rest, app] }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }

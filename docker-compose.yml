# =============================================================================
# NoloTrack — installazione self-hosted (senza Vercel né Supabase cloud)
# =============================================================================
# Servizi:
#   db       PostgreSQL 15 (immagine Supabase: ruoli e schema auth già pronti)
#   auth     GoTrue — login email/password, Google OAuth, inviti via email
#   migrate  applica database/ddl + database/dml (one-shot, a ogni avvio)
#   rest     PostgREST — API REST sui dati, protette da Row Level Security
#   app      Next.js (questo repository)
#   gateway  nginx — unico punto di ingresso (porta HTTP_PORT)
#   caddy    HTTPS automatico, solo con `--profile https`
#
# Avvio:   cp .env.example .env  →  node scripts/genera-env.mjs  →  docker compose up -d --build
# Guida:   docs/self-hosting/INSTALLAZIONE.md
# =============================================================================

name: nolotrack

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: supabase/postgres:15.8.1.060
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?imposta JWT_SECRET in .env}
      JWT_EXP: ${JWT_EXP:-3600}
      TZ: Europe/Rome
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Per accedere al DB dal server stesso (pgAdmin, DBeaver, psql) togli il commento:
    # ports:
    #   - "127.0.0.1:5432:5432"

  auth:
    <<: *restart
    image: supabase/gotrue:v2.177.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXP:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Registrazione libera disattivata: gli utenti li crea l'admin (invito o script)
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-false}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_SENDER:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-NoloTrack}
      # Login con Google (facoltativo). Redirect URI da registrare su Google Cloud:
      #   ${PUBLIC_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_LOGIN_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_LOGIN_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: supabase/postgres:15.8.1.060
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    entrypoint: ["sh", "/migrate.sh"]
    environment:
      PGHOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/migrate/migrate.sh:/migrate.sh:ro
      - ./database:/database:ro

  rest:
    <<: *restart
    image: postgrest/postgrest:v12.2.12
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXP:-3600}
      PGRST_DB_MAX_ROWS: 10000

  app:
    <<: *restart
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_CONTACT_CITY: ${NEXT_PUBLIC_CONTACT_CITY:-}
        NEXT_PUBLIC_NCC_LICENSE: ${NEXT_PUBLIC_NCC_LICENSE:-}
        NEXT_PUBLIC_WHATSAPP_DISPLAY_NUMBER: ${NEXT_PUBLIC_WHATSAPP_DISPLAY_NUMBER:-}
    image: nolotrack-app:latest
    depends_on:
      rest:
        condition: service_started
    environment:
      # Server Next.js → API Supabase-compatibili passando dalla rete interna
      SUPABASE_INTERNAL_URL: http://gateway
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_URL}
      # Email (pagina Invia) — Gmail SMTP
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # Google Calendar (pagina Agenda)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Notifiche push
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # WhatsApp (Meta Cloud API)
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN:-}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID:-}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-}

  gateway:
    <<: *restart
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  caddy:
    <<: *restart
    image: caddy:2.8-alpine
    profiles: ["https"]
    depends_on:
      - gateway
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
